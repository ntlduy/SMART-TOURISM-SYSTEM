<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<div class="header-top py-2 bg-custom">
    <div class="container">
        <div class="row align-items-center">
            
            <div class="col-md-3 col-lg-2">
                <a href="/" class="text-white text-decoration-none font-weight-bold h4">
                    <i class="fas fa-chart-bar"></i> Smart travel
                </a>
            </div>

            <div class="col-md-4 col-lg-6 d-flex align-items-center">
                <div class="dropdown mr-2 d-none d-lg-block">
                    <button class="btn btn-sm btn-outline-light dropdown-toggle border-0" type="button" style="background: rgba(0,0,0,0.1);">
                        <small>Xem cửa hàng tại:</small><br>
                        <b>Miền Bắc</b>
                    </button>
                </div>

                <form class="w-60" action="{{ url_for('index') }}">
                    <div class="input-group">
                        <input type="text" name="keyword" class="form-control border-0" placeholder="Tìm kiếm sản phẩm...">
                        <div class="input-group-append">
                            <button class="btn btn-light text-custom" type="submit">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="col-md-5 col-lg-4 d-flex justify-content-end align-items-center text-nowrap">
                <div class="mr-3 text-center">
                    {% if current_user.is_authenticated %}
                        <a href="{{ url_for('info_user') }}" class="text-white text-decoration-none">
                            <div class="d-flex align-items-center bg-dark rounded px-2 py-1" style="background: rgba(0,0,0,0.2) !important;">
                                {% if current_user.avatar %}
                                    <img src="{{ current_user.avatar }}" class="rounded-circle mr-2" width="25" height="25">
                                {% else %}
                                    <i class="fas fa-user-circle fa-lg mr-1"></i>
                                {% endif %}
                                <small>{{ current_user.username }}</small>
                            </div>
                        </a>
                    {% else %}
                        <div class="d-flex align-items-center">
                            <a href="{{ url_for('user_signin') }}" class="text-white text-decoration-none mr-2">
                                <div class="d-flex flex-column align-items-center justify-content-center rounded px-2 py-1" 
                                     style="background: rgba(0,0,0,0.15); width: 80px;">
                                    <i class="fas fa-sign-in-alt mb-1"></i>
                                    <small class="font-weight-bold" style="font-size: 11px;">Đăng nhập</small>
                                </div>
                            </a>
                            <a href="{{ url_for('user_register') }}" class="text-white text-decoration-none">
                                <div class="d-flex flex-column align-items-center justify-content-center rounded px-2 py-1" 
                                     style="background: rgba(0,0,0,0.15); width: 80px;">
                                    <i class="fas fa-user-plus mb-1"></i>
                                    <small class="font-weight-bold" style="font-size: 11px;">Đăng ký</small>
                                </div>
                            </a>
                        </div>
                    {% endif %}
                </div>

                <div class="mr-3 position-relative">
                    <a href="#" class="btn btn-sm font-weight-bold text-white" style="background-color: #9e7b2e; border:none;">
                        <i class="fas fa-shopping-cart"></i> Giỏ hàng
                        <span class="badge badge-danger position-absolute" style="top: -5px; right: -5px;">0</span>
                    </a>
                </div>
                
                <div class="d-none d-xl-flex font-weight-bold text-uppercase" style="font-size: 12px;">
                    <a href="#" class="text-white px-2 border-right">Tin tức</a>
                    <a href="#" class="text-white px-2 border-right">Events</a>
                    <a href="#" class="text-white px-2">Tra cứu BH</a>
                </div>
            </div>
        </div>
    </div>
</div>



<div class="header-nav sticky-top shadow-sm bg-custom" style="border-top: 1px solid rgba(255,255,255,0.2); z-index: 1020;">
    <div class="container">
        <ul class="nav nav-fill d-flex justify-content-between align-items-center">
            
            <li class="nav-item py-2">
                <a class="nav-link text-white font-weight-bold d-flex align-items-center px-3 {% if request.endpoint == 'index' %}active{% endif %}" 
                   href="{{ url_for('index') }}">
                    <i class="fas fa-home fa-lg mr-2"></i> Trang chủ
                </a>
            </li>

            <li class="nav-item py-2">
                <a class="nav-link text-white font-weight-bold d-flex align-items-center px-3 {% if request.endpoint == 'shop' %}active{% endif %}" 
                   href="{{ url_for('shop') }}">
                    <i class="fas fa-store fa-lg mr-2"></i> Cửa hàng
                </a>
            </li>

            <li class="nav-item py-2">
                <a class="nav-link text-white font-weight-bold d-flex align-items-center px-3 {% if request.endpoint == 'about' %}active{% endif %}" 
                   href="{{ url_for('about') }}">
                    <i class="fas fa-info-circle fa-lg mr-2"></i> About
                </a>
            </li>

            <li class="nav-item py-2">
                <a class="nav-link text-white font-weight-bold d-flex align-items-center px-3 {% if request.endpoint == 'search' %}active{% endif %}" 
                   href="{{ url_for('search') }}">
                    <i class="fas fa-camera fa-lg mr-2"></i> Tìm kiếm bằng hình ảnh
                </a>
            </li>

            <li class="nav-item py-2">
                <a class="nav-link text-white font-weight-bold d-flex align-items-center px-3 {% if request.endpoint == 'challenge' %}active{% endif %}" 
                   href="{{ url_for('challenge') }}">
                    <i class="fas fa-gamepad fa-lg mr-2"></i> Challenge
                </a>
            </li>

        </ul>
    </div>
</div>
