{% extends 'layout/base.html' %}

{% block title %}Đăng nhập{% endblock %}

{% block css %}
<style>
    .login-container { max-width: 500px; margin: 50px auto; }
    

    .custom-input {
        background-color: #f0f2f5;
        border: none;
        height: 50px;
        border-radius: 4px;
        font-size: 14px;
    }
    .custom-input:focus { background-color: #e4e6e9; box-shadow: none; }

    .btn-login {
        background-color: #fd7e14; 
        color: white;
        font-weight: bold;
        height: 50px;
        font-size: 18px;
        text-transform: uppercase;
        border-radius: 4px;
        transition: all 0.3s;
        border: none;
    }
    .btn-login:hover {
        background-color: #e36d0d;
        color: white;
    }

    .separator {
        display: flex; align-items: center; text-align: center; color: #ccc; margin: 20px 0;
    }
    .separator::before, .separator::after {
        content: ''; flex: 1; border-bottom: 1px solid #ddd;
    }
    .separator:not(:empty)::before { margin-right: .5em; }
    .separator:not(:empty)::after { margin-left: .5em; }

    .btn-google {
        border: 1px solid #ddd; background: white; color: #555; font-weight: 500; height: 45px;
    }
    .login-links { font-size: 14px; margin-top: 15px; }
    .login-links a { text-decoration: none; }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="login-container text-center">
        
        <h2 class="brand-title">forgot Password</h2>
        
        {% if err_msg %}
        <div class="alert alert-danger text-left">
            <small>{{ err_msg }}</small>
        </div>
        {% endif %}

        <form method="post" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <input type="email" class="form-control custom-input" id="email" name="email" placeholder="Nhâp email" required>
            </div>
            <button type="submit" class="btn btn-login btn-block mt-4">Gửi</button>
        </form>

    </div>
</div>
{% endblock %}
