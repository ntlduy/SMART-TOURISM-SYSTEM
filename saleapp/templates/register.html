{% extends 'layout/base.html' %}

{% block title %}Đăng ký tài khoản{% endblock %}

{% block css %}
<style>
    .register-container { max-width: 600px; margin: 50px auto; background: white; }
    .register-title { text-align: center; color: #333; font-size: 24px; margin-bottom: 30px; font-weight: 500; }

    .form-control {
        height: 45px; border-radius: 4px; border: 1px solid #ced4da; font-size: 14px;
    }
    .form-control:focus { border-color: #80bdff; box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25); }

    .file-input-wrapper { border: 1px dashed #ced4da; padding: 10px; border-radius: 4px; background: #f8f9fa; }
    
    .btn-confirm {
        background-color: #f58634; 
        color: white; font-weight: bold; text-transform: uppercase;
        height: 50px; font-size: 18px; border: none; border-radius: 4px;
        width: 100%; margin-top: 20px;
    }
    .btn-confirm:hover { background-color: #e07220; color: white; }

    .gender-group { display: flex; align-items: center; margin-bottom: 15px; }
    .gender-item { margin-right: 20px; display: flex; align-items: center; }
    .gender-item input { margin-right: 5px; width: 16px; height: 16px; }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="register-container">
        <h3 class="brand-title text-center">Thông tin cá nhân</h3>
        {% if err_msg %}
        <div class="alert alert-danger text-center">{{ err_msg }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('user_register') }}" enctype="multipart/form-data">
            <div class="form-group"><input type="text" class="form-control" id="name" name="name" placeholder="Họ và tên..." required></div>
            <div class="form-group"><input type="email" class="form-control" id="email" name="email" placeholder="Email (Ví dụ: duyn26353@gmail.com)"></div>
            <div class="form-group"><input type="text" class="form-control" id="username" name="username" placeholder="Tên đăng nhập" required /></div>
            <div class="form-group"><input type="text" class="form-control" name="phone" placeholder="Số điện thoại"></div>
            <div class="gender-group">
                <div class="gender-item"><input type="radio" id="male" name="gender" value="1" checked><label for="male" class="mb-0">Nam</label></div>
                <div class="gender-item"><input type="radio" id="female" name="gender" value="0"><label for="female" class="mb-0">Nữ</label></div>
            </div>
            <div class="form-row mb-3">
                <div class="col"><label class="small text-muted mb-1">Ngày sinh</label><select class="form-control" name="day"><option>01</option>{% for i in range(2, 32) %}<option>{{ i }}</option>{% endfor %}</select></div>
                <div class="col"><label class="small text-muted mb-1">Tháng</label><select class="form-control" name="month"><option>Tháng 01</option>{% for i in range(2, 13) %}<option>Tháng {{ i }}</option>{% endfor %}</select></div>
                <div class="col"><label class="small text-muted mb-1">Năm</label><select class="form-control" name="year"><option>2025</option>{% for i in range(2024, 1950, -1) %}<option>{{ i }}</option>{% endfor %}</select></div>
            </div>
            <div class="form-group">
                <label for="avatar" class="small text-muted mb-1">Ảnh đại diện</label>
                <div class="file-input-wrapper"><input type="file" class="form-control-file" id="avatar" name="avatar"></div>
            </div>
            <div class="form-group"><input type="password" class="form-control" id="pass" name="pass" placeholder="Mật khẩu" required></div>
            <div class="form-group"><input type="password" class="form-control" id="confirm" name="confirm" placeholder="Nhập lại mật khẩu" required></div>
            <button type="submit" class="btn btn-confirm">XÁC NHẬN</button>
        </form>
    </div>
</div>
{% endblock %}
